services:
  postgres:
    image: postgres:16
    container_name: vogx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vogx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vogx_postgres_data:/var/lib/postgresql/data

volumes:
  vogx_postgres_data:
